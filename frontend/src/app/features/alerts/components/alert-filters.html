<section class="panel panel-body mb-4" aria-label="Filtros de alertas">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <fieldset [disabled]="busy()">
      <div class="row g-3">
        <div class="col-sm-6 col-lg-3">
          <label for="alert-state" class="form-label">Estado</label
          ><select id="alert-state" class="form-select" formControlName="estado">
            <option value="">Todos</option>
            <option value="Pendiente">Pendiente</option>
            <option value="En revision">En revisión</option>
            <option value="Resuelta">Resuelta</option>
            <option value="Descartada">Descartada</option>
          </select>
        </div>
        <div class="col-sm-6 col-lg-3">
          <label for="alert-rule" class="form-label">ID de regla (opcional)</label
          ><input
            id="alert-rule"
            type="number"
            class="form-control"
            formControlName="reglaAnomaliaId"
            min="1"
            max="2147483647"
            step="1"
            aria-describedby="alert-rule-error"
          /><app-field-error [control]="form.controls.reglaAnomaliaId" errorId="alert-rule-error" />
        </div>
        @if (auditor) {
          <div class="col-sm-6 col-lg-3">
            <label for="alert-area" class="form-label">ID de área (opcional)</label
            ><input
              id="alert-area"
              type="number"
              class="form-control"
              formControlName="areaId"
              min="1"
              max="2147483647"
              step="1"
              aria-describedby="alert-area-error"
            /><app-field-error [control]="form.controls.areaId" errorId="alert-area-error" />
          </div>
        }
        <div class="col-sm-6 col-lg-3">
          <label for="alert-user" class="form-label">ID de usuario (opcional)</label
          ><input
            id="alert-user"
            type="number"
            class="form-control"
            formControlName="usuarioId"
            min="1"
            max="2147483647"
            step="1"
            aria-describedby="alert-user-error"
          /><app-field-error [control]="form.controls.usuarioId" errorId="alert-user-error" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <label for="alert-from" class="form-label">Evento desde (UTC)</label
          ><input
            id="alert-from"
            type="datetime-local"
            class="form-control"
            formControlName="fechaDesde"
            step="1"
            min="0001-01-01T00:00:00"
            max="9999-12-31T23:59:59"
            aria-describedby="alert-from-error"
          /><app-field-error [control]="form.controls.fechaDesde" errorId="alert-from-error" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <label for="alert-until" class="form-label">Evento hasta (UTC)</label
          ><input
            id="alert-until"
            type="datetime-local"
            class="form-control"
            formControlName="fechaHasta"
            step="1"
            min="0001-01-01T00:00:00"
            max="9999-12-31T23:59:59"
            aria-describedby="alert-until-error"
          /><app-field-error [control]="form.controls.fechaHasta" errorId="alert-until-error" />
        </div>
        <div class="col-sm-6 col-lg-4">
          <label for="alert-size" class="form-label">Resultados por página</label
          ><select id="alert-size" class="form-select" formControlName="tamanoPagina">
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
          </select>
        </div>
      </div>
      @if (form.hasError('dateRange') && form.touched) {
        <p class="field-error mt-3" role="alert">
          La fecha inicial no puede superar la fecha final.
        </p>
      }
      <p class="form-text mt-3">
        Los filtros de fecha corresponden al evento, no a su detección. Hasta incluye todo el
        segundo seleccionado. El servidor aplica su alcance autorizado.
      </p>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Consultar</button
        ><button type="button" class="btn btn-outline-secondary" (click)="clear()">
          Limpiar filtros
        </button>
      </div>
    </fieldset>
  </form>
</section>
